<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto | TiZO</title>
    <meta name="description" content="Descubre los detalles de cada playera TiZO y agrégala a tu carrito.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .detalle-producto { max-width: 1050px; margin: 3rem auto; }
        .detalle-imagen { width: 100%; max-height: 680px; object-fit: contain; background: #f7f5f1; border-radius: 8px; }
        .detalle-info { padding: clamp(1rem, 4vw, 3rem); }
        .detalle-precio { font-size: 1.35rem; font-weight: 600; }
        .btn-tizo { background: #171717; color: white; border-radius: 0; padding: .85rem 1.5rem; }
        .btn-tizo:hover { background: #393939; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-tizo">        <div class="container">
        <a class="navbar-brand" href="index.html"><i class="bi bi-arrow-left"></i> TiZO</a>
        <a href="carrito.html" class="text-dark fs-4 position-relative" aria-label="Ver carrito">
            <i class="bi bi-bag"></i><span id="contadorCarrito" class="badge bg-dark">0</span>
        </a>
    </nav>

    <main class="container detalle-producto">
        <div class="row g-4 align-items-center">
            <div class="col-12 col-md-7"><img id="productoImagen" class="detalle-imagen" src="" alt=""></div>
            <section class="col-12 col-md-5 detalle-info">
                <p class="text-secondary mb-2">TIZO / CLOTHING</p>
                <h1 id="productoNombre" class="mb-3"></h1>
                <p id="productoPrecio" class="detalle-precio mb-4"></p>
                <p class="text-secondary">Una pieza TiZO para expresar tu estilo todos los días.</p>
                <div class="mb-3">
                    <label for="talla" class="form-label">Selecciona tu talla</label>
                    <select id="talla" class="form-select" required>
                        <option value="">Elige una talla</option><option>CH</option><option>M</option><option>G</option><option>EG</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input id="cantidad" type="number" class="form-control" min="1" max="10" value="1">
                </div>
                <button id="agregarCarrito" class="btn btn-tizo w-100" type="button">Agregar al carrito <i class="bi bi-bag-plus ms-2"></i></button>
                <p id="mensajeCarrito" class="small mt-3" role="status" aria-live="polite"></p>
                <a href="index.html" class="text-secondary small">← Seguir explorando</a>
            </section>
        </div>
    </main>

    <script>
        const productos = [
            { id: 1, nombre: 'Red Velvet', imagen: 'red.jpg', precio: 450 },
            { id: 2, nombre: 'OnioN', imagen: 'FRPlayere.jpg', precio: 400 },
            { id: 3, nombre: 'VAES', imagen: 'imagen3.jpg', precio: 350 },
            { id: 4, nombre: 'BoAT', imagen: 'boat.jpeg', precio: 400 },
            { id: 5, nombre: 'anaId', imagen: 'anotherone.jpeg', precio: 400 },
            { id: 6, nombre: 'TTc', imagen: 'teniscourt.jpeg', precio: 400 },
            { id: 7, nombre: 'TequiLA', imagen: 'tequila.jpeg', precio: 400 },
            { id: 8, nombre: 'AaroN', imagen: 'swigd.jpeg', precio: 400 },
            { id: 9, nombre: 'Txas Boy', imagen: 'resi.jpeg', precio: 400 }
        ];
        const id = Number(new URLSearchParams(window.location.search).get('id'));
        const producto = productos.find(item => item.id === id);
        const formatoPrecio = precio => precio.toLocaleString('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });

        if (!producto) {
            document.querySelector('main').innerHTML = '<div class="text-center py-5"><h1>Producto no encontrado</h1><a href="index.html">Volver a la colección</a></div>';
        } else {
            document.title = producto.nombre + ' | TiZO';
            document.getElementById('productoNombre').textContent = producto.nombre;
            document.getElementById('productoImagen').src = producto.imagen;
            document.getElementById('productoImagen').alt = 'Playera ' + producto.nombre;
            document.getElementById('productoPrecio').textContent = formatoPrecio(producto.precio);
            document.getElementById('agregarCarrito').addEventListener('click', () => {
                const talla = document.getElementById('talla').value;
                const cantidad = Number(document.getElementById('cantidad').value);
                const mensaje = document.getElementById('mensajeCarrito');
                if (!talla) { mensaje.textContent = 'Selecciona una talla antes de continuar.'; return; }
                if (!Number.isInteger(cantidad) || cantidad < 1 || cantidad > 10) { mensaje.textContent = 'Elige una cantidad entre 1 y 10.'; return; }
                const carrito = JSON.parse(localStorage.getItem('tizoCarrito') || '[]');
                const existente = carrito.find(item => item.id === producto.id && item.talla === talla);
                if (existente) existente.cantidad += cantidad;
                else carrito.push({ ...producto, talla, cantidad });
                localStorage.setItem('tizoCarrito', JSON.stringify(carrito));
                actualizarContador();
                mensaje.textContent = '¡Listo! La playera se agregó a tu carrito.';
            });
        }
        function actualizarContador() {
            const carrito = JSON.parse(localStorage.getItem('tizoCarrito') || '[]');
            document.getElementById('contadorCarrito').textContent = carrito.reduce((total, item) => total + Number(item.cantidad || 1), 0);
        }
        actualizarContador();
    </script>
</body>
</html>
